<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Life Insurance Pricing UI</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div>
        <h1>Life Insurance Pricing</h1>
        <p>Local pricing runs with configurable inputs and quick visual feedback.</p>
      </div>
      <div class="header-actions">
        <span class="status" id="status">Ready</span>
      </div>
    </header>

    <main class="grid">
      <section class="panel">
        <h2>Inputs</h2>
        <div class="field-row">
          <label for="productSelect">Product</label>
          <select id="productSelect"></select>
        </div>

        <div class="field-row hidden" id="newProductRow">
          <label for="newProductName">New Product Name</label>
          <input id="newProductName" type="text" placeholder="e.g. product_C" />
        </div>

        <button id="saveProductBtn" class="secondary hidden" type="button">Save Product</button>

        <div class="field-row">
          <label for="mortalityFile">Mortality File</label>
          <select id="mortalityFile"></select>
        </div>

        <div class="field-row">
          <label for="sheetName">Sheet Name</label>
          <input id="sheetName" type="text" value="Sheet1" />
        </div>

        <div class="upload-row">
          <input id="fileUpload" type="file" accept=".xlsx" />
          <button id="uploadBtn" type="button">Upload</button>
        </div>

        <div class="form-grid">
          <div class="field-row">
            <label for="age">Age</label>
            <input id="age" type="number" min="0" />
          </div>
          <div class="field-row">
            <label for="premium">Premium</label>
            <input id="premium" type="number" step="0.01" />
          </div>
          <div class="field-row">
            <label for="claimsAmount">Claims Amount</label>
            <input id="claimsAmount" type="number" step="0.01" />
          </div>
          <div class="field-row">
            <label for="policyholderCount">Policyholders</label>
            <input id="policyholderCount" type="number" min="1" />
          </div>
          <div class="field-row">
            <label for="projectionYears">Projection Years</label>
            <input id="projectionYears" type="number" min="1" />
          </div>
          <div class="field-row">
            <label for="interestRate">Interest Rate</label>
            <input id="interestRate" type="number" step="0.0001" />
          </div>
          <div class="field-row">
            <label for="inflationRate">Inflation Rate</label>
            <input id="inflationRate" type="number" step="0.0001" />
          </div>
          <div class="field-row">
            <label for="commission">Commission</label>
            <input id="commission" type="number" step="0.01" />
          </div>
          <div class="field-row">
            <label for="maintenance">Maintenance</label>
            <input id="maintenance" type="number" step="0.01" />
          </div>
        </div>

        <div class="field-row full-width">
          <label for="lapseVector">Lapse Vector (comma or newline separated)</label>
          <textarea id="lapseVector" rows="4"></textarea>
        </div>

        <button id="runBtn" class="primary" type="button">Run Pricing</button>

        <div class="optimize-row">
          <div class="field-row">
            <label for="targetMargin">Target Margin</label>
            <input id="targetMargin" type="number" step="0.0001" value="0.07" />
          </div>
          <button id="optimizeBtn" class="secondary" type="button">Optimize Margin Rate</button>
        </div>
      </section>

      <section class="panel">
        <h2>Summary</h2>
        <div class="cards" id="summaryCards"></div>

        <div class="charts">
          <div class="chart-card">
            <h3>Nominal Cashflows</h3>
            <canvas id="cashflowChart"></canvas>
          </div>
          <div class="chart-card">
            <h3>Present Value Cashflow</h3>
            <canvas id="pvChart"></canvas>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
